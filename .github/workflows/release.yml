name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The updater compares the tag with the version built into powerkit.exe; if they
      # differ, every install would keep offering the same update.
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p powerkit-host --bin powerkit

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/powerkit.exe --title "PowerKit ${GITHUB_REF_NAME#v}" --generate-notes
