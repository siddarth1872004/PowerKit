name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The updater compares the tag with the version built into powerkit.exe; if they
      # differ, every install would keep offering the same update.
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p powerkit-host --bin powerkit

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # notes/<tag>.md is what What's new in the tray shows; without one GitHub lists the changes.
        # A release made by hand on GitHub for this tag is filled in instead of failing.
        run: |
          title="PowerKit ${GITHUB_REF_NAME#v}"
          file="notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            notes=()
            if [ -f "$file" ]; then notes=(--notes-file "$file"); fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --draft=false "${notes[@]}"
            gh release upload "$GITHUB_REF_NAME" target/release/powerkit.exe --clobber
          else
            notes=(--generate-notes)
            if [ -f "$file" ]; then notes=(--notes-file "$file"); fi
            gh release create "$GITHUB_REF_NAME" target/release/powerkit.exe --title "$title" "${notes[@]}"
          fi
