[package]
name = "file-explorer"
description = "PowerKit utility: preview pane handlers and thumbnails for more file types in File Explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
powerkit-core.workspace = true
powerkit-config.workspace = true
powerkit-plugin-api.workspace = true
powerkit-preview.workspace = true

[target.'cfg(windows)'.dependencies]
powerkit-platform.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
