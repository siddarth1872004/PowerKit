[package]
name = "powerkit-menu"
description = "The entries PowerKit adds to the top level of the Windows 11 Explorer context menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Builds the COM server Explorer loads. Off for powerkit.exe, which only needs the
# entry list; the DLL is built on its own and embedded.
server = []

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[lints]
workspace = true
