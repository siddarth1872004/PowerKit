[workspace]
resolver = "2"
members = [
    # (members that do not exist yet are added as milestones land)
    "crates/*",
    "modules/always-on-top",
    "modules/awake",
    "modules/color-picker",
    "modules/fancy-zones",
    "modules/keyboard-manager",
    "modules/launcher",
    "modules/light-switch",
    "modules/quick-accent",
    "modules/mouse-utilities",
    "modules/crop-and-lock",
    "modules/shortcut-guide",
    "modules/grab-and-move",
    "modules/window-hopper",
    "modules/window-tiling",
    "modules/quick-notes",
    "modules/clipboard-history",
    "modules/screenshot",
    "modules/screen-recorder",
    "modules/hosts-editor",
    "modules/environment-variables",
    "modules/registry-preview",
    "modules/new-plus",
    "modules/file-locksmith",
    "modules/image-resizer",
    "modules/text-extractor",
    "modules/power-display",
    "modules/screen-ruler",
    "modules/power-rename",
    "modules/zoom-it",
    "modules/workspaces",
    "modules/peek",
    "modules/power-plan",
    "modules/advanced-paste",
    "modules/command-not-found",
    "modules/file-explorer",
    "modules/mouse-without-borders",
    "apps/background",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["PowerKit contributors"]
repository = "https://github.com/powerkit/powerkit"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
regex = "1"
proptest = "1"
tempfile = "3"

powerkit-core = { path = "crates/powerkit-core" }
powerkit-config = { path = "crates/powerkit-config" }
powerkit-guide = { path = "crates/powerkit-guide" }
powerkit-ipc = { path = "crates/powerkit-ipc" }
powerkit-logging = { path = "crates/powerkit-logging" }
powerkit-platform = { path = "crates/powerkit-platform" }
powerkit-menu = { path = "crates/powerkit-menu" }
powerkit-preview = { path = "crates/powerkit-preview" }
powerkit-plugin-api = { path = "crates/powerkit-plugin-api" }
always-on-top = { path = "modules/always-on-top" }
color-picker = { path = "modules/color-picker" }
power-rename = { path = "modules/power-rename" }
zoom-it = { path = "modules/zoom-it" }
workspaces = { path = "modules/workspaces" }
peek = { path = "modules/peek" }
power-plan = { path = "modules/power-plan" }
advanced-paste = { path = "modules/advanced-paste" }
command-not-found = { path = "modules/command-not-found" }
file-explorer = { path = "modules/file-explorer" }
mouse-without-borders = { path = "modules/mouse-without-borders" }
fancy-zones = { path = "modules/fancy-zones" }
launcher = { path = "modules/launcher" }
keyboard-manager = { path = "modules/keyboard-manager" }
awake = { path = "modules/awake" }
light-switch = { path = "modules/light-switch" }
quick-accent = { path = "modules/quick-accent" }
mouse-utilities = { path = "modules/mouse-utilities" }
crop-and-lock = { path = "modules/crop-and-lock" }
shortcut-guide = { path = "modules/shortcut-guide" }
grab-and-move = { path = "modules/grab-and-move" }
window-hopper = { path = "modules/window-hopper" }
window-tiling = { path = "modules/window-tiling" }
quick-notes = { path = "modules/quick-notes" }
clipboard-history = { path = "modules/clipboard-history" }
screenshot = { path = "modules/screenshot" }
screen-recorder = { path = "modules/screen-recorder" }
hosts-editor = { path = "modules/hosts-editor" }
environment-variables = { path = "modules/environment-variables" }
registry-preview = { path = "modules/registry-preview" }
new-plus = { path = "modules/new-plus" }
file-locksmith = { path = "modules/file-locksmith" }
image-resizer = { path = "modules/image-resizer" }
text-extractor = { path = "modules/text-extractor" }
power-display = { path = "modules/power-display" }
screen-ruler = { path = "modules/screen-ruler" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
